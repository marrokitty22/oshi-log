  <div class="gate-card">

    <p>パスワードを入力してください。</p>
    <h1 id="gateTitle" class="hidden">Oshi Log</h1>
    <form id="gateForm">
      <input id="gatePassword" type="password" autocomplete="current-password" placeholder="パスワード" required>

      <div id="gateError" class="gate-error" role="status" aria-live="polite"></div>
    </form>

<script>
/*
 * 公開前に設定してください：
 * 下の PASSWORD_HASH を、使いたいパスワードの SHA-256 ハッシュに置き換えます。
 * ハッシュはブラウザの開発者ツール等で作成できますが、パスワード画面は簡易的な抑止です。
 * GitHub Pagesは公開サイトなので、機密情報の保護や本格的なアクセス制御には使えません。
 */
const PASSWORD_HASH = "ed5d450f46e02591914d670bde2ccd37c3f98d691a323d5913eec2af0fc9b62d";document.body.classList.add("gated");
document.getElementById("gateForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  const input = document.getElementById("gatePassword").value;
  const error = document.getElementById("gateError");
  if (PASSWORD_HASH === "CHANGE_ME_TO_SHA256_HASH") {
    error.textContent = "公開前の設定が必要です。HTML内の PASSWORD_HASH を設定してください。";
    return;
  }
  try {
    const bytes = new TextEncoder().encode(input);
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    const hash = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, "0")).join("");
    if (hash === PASSWORD_HASH.toLowerCase()) {
      document.getElementById("passwordGate").remove();
      document.body.classList.remove("gated");
      sessionStorage.setItem("oshiLogUnlocked", "1");
    } else {
      error.textContent = "パスワードが違うみたい。もう一度試してね。";
      document.getElementById("gatePassword").value = "";
      document.getElementById("gatePassword").focus();
    }
  } catch (e) {
    error.textContent = "このブラウザではパスワード確認を実行できません。";
  }
});
if (sessionStorage.getItem("oshiLogUnlocked") === "1") {
  document.getElementById("passwordGate").remove();
  document.body.classList.remove("gated");
}
</script>

 kinds:[{value:'chat',label:'リリイベ・特典会（チャット形式）'},{value:'live',label:'ライブ・公演レポ'}],

 };

 }).join('');
 if(selected!=null&&Array.from(el.options).some(o=>o.value===selected))el.value=selected;

function renderMemberEditor(members){const el=document.getElementById('memberEditorList');if(!el)return;const list=Array.isArray(members)&&members.length?members:[{name:'推し',photo:''}];el.innerHTML=list.map((m,i)=>{const photo=typeof m.photo==='string'&&m.photo.startsWith('data:image/')?m.photo:'';const initial=(m.name||'メンバー').slice(0,1);return `<div class="member-editor-row" data-index="${i}">${photo?`<img class="member-editor-avatar" src="${esc(photo)}" alt="${esc(m.name||'メンバー')}の写真">`:`<div class="member-editor-placeholder">${esc(initial)}</div>`}<div class="member-editor-controls"><input type="text" class="member-editor-name" value="${esc(m.name||'')}" maxlength="40" placeholder="メンバー名"><input type="file" accept="image/*" aria-label="${esc(m.name||'メンバー')}の写真を選ぶ" onchange="updateMemberPhoto(event,${i})"><input type="hidden" class="member-editor-photo" value="${esc(photo)}"></div><button type="button" class="secondary small member-editor-remove" onclick="removeMemberEditorRow(${i})" aria-label="メンバーを削除">削除</button></div>`}).join('')}
function readMemberEditor(){return Array.from(document.querySelectorAll('#memberEditorList .member-editor-row')).map(row=>({name:row.querySelector('.member-editor-name')?.value.trim()||'',photo:row.querySelector('.member-editor-photo')?.value||''})).filter(m=>m.name||m.photo)}
function addMemberEditorRow(){const members=readMemberEditor();members.push({name:'',photo:''});renderMemberEditor(members);const inputs=document.querySelectorAll('#memberEditorList .member-editor-name');inputs[inputs.length-1]?.focus()}
function removeMemberEditorRow(index){const members=readMemberEditor();if(members.length<=1){alert('メンバーは最低1人必要だよ');return}members.splice(index,1);renderMemberEditor(members)}
async function updateMemberPhoto(ev,index){const file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('写真ファイルを選んでね');return}try{const photo=await resizeMemberPhoto(file);const row=document.querySelector(`#memberEditorList .member-editor-row[data-index="${index}"]`);if(!row)return;row.querySelector('.member-editor-photo').value=photo;const old=row.querySelector('.member-editor-avatar,.member-editor-placeholder');const img=document.createElement('img');img.className='member-editor-avatar';img.src=photo;img.alt=(row.querySelector('.member-editor-name').value||'メンバー')+'の写真';old.replaceWith(img)}catch(err){alert('写真を読み込めなかったよ。別の写真を試してね')}finally{ev.target.value=''}}
function resizeMemberPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const size=320,side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;canvas.getContext('2d').drawImage(img,sx,sy,side,side,0,0,size,size);resolve(canvas.toDataURL('image/jpeg',0.84))};img.src=reader.result};reader.readAsDataURL(file)})}
function openSettings(){
 document.getElementById('settingTitle').value=appSettings.title||'Oshi Log';

function rgbFromHex(hex){const h=String(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return [236,72,153];return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mixColor(a,b,amount){const x=rgbFromHex(a),y=rgbFromHex(b);return '#'+x.map((v,i)=>Math.round(v*(1-amount)+y[i]*amount).toString(16).padStart(2,'0')).join('')}
function darkenHex(hex,amount){return '#'+rgbFromHex(hex).map(v=>Math.round(v*(1-amount)).toString(16).padStart(2,'0')).join('')}
function contrastInk(hex){const c=rgbFromHex(hex).map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])>0.48?'#54233d':'#ffffff'}
function colorName(c){return ({'#ec4899':'ピンク','#38bdf8':'水色','#a78bfa':'紫','#34d399':'緑','#f87171':'赤','#fbbf24':'黄色','#64748b':'グレー','#c084fc':'ラベンダー','#222222':'黒'})[c]||''}
function previewSettingImage(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('画像ファイルを選んでね');return}
 const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{
  const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  pendingImage=canvas.toDataURL('image/jpeg',0.82);
  const p=document.getElementById('coverPreview');p.src=pendingImage;p.style.display='block';
 };img.src=reader.result};reader.readAsDataURL(file);
}

let events=loadData(), viewDate=new Date(), selectedDate=isoDate(new Date()), currentId=null, currentReportId=null;
function loadData(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function persist(){localStorage.setItem(KEY,JSON.stringify(events));try{renderDashboard();renderReportSearch()}catch(e){}}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function isoDate(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){if(!d)return '日付未設定';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);renderCalendar()}
function renderCalendar(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth();document.getElementById('monthLabel').textContent=`${y}年 ${m+1}月`;
 const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));let out=['月','火','水','木','金','土','日'].map(d=>`<div class="dow">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d),arr=events.filter(e=>e.date===ds);out+=`<button class="day ${d.getMonth()!==m?'muted':''} ${ds===isoDate(new Date())?'today':''} ${ds===selectedDate?'selected':''}" onclick="selectDate('${ds}')"><span class="num">${d.getDate()}</span>${arr.slice(0,2).map(e=>`<span class="dot">${esc(e.name)}</span>`).join('')}${arr.length>2?`<span class="dot">＋${arr.length-2}件</span>`:''}</button>`}
 document.getElementById('calendar').innerHTML=out;
}
function selectDate(d){selectedDate=d;viewDate=new Date(d+'T00:00:00');renderCalendar();document.getElementById('selectedHeading').textContent='🎪'+fmt(d)+'の予定';renderEvents()}
function renderEvents(){
 const q=(document.getElementById('search').value||'').toLowerCase(),fs=document.getElementById('filterStatus').value,ft=document.getElementById('filterType').value,allMode=!!document.getElementById('allSearchDetails')?.open;
 document.getElementById('selectedHeading').textContent=allMode?'🎪すべての予定':(selectedDate?'🎪'+fmt(selectedDate)+'の予定':'🎪予定');
 let arr=events.filter(e=>(allMode||!selectedDate||e.date===selectedDate)&&(!fs||e.status===fs)&&(!ft||e.type===ft));
 if(q)arr=events.filter(e=>(!fs||e.status===fs)&&(!ft||e.type===ft)&&[e.name,e.venue,e.memo,...(e.reports||[]).map(r=>JSON.stringify(r))].join(' ').toLowerCase().includes(q));
 arr.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
 document.getElementById('eventList').innerHTML=arr.length?arr.map(e=>`<article class="eventcard"><div class="eventtop"><div><h3>${esc(e.name)}</h3><div class="meta">${fmt(e.date)} ${e.time||''}<br>${e.venue?esc(e.venue)+' · ':''}${e.type?esc(e.type):''}</div></div><span class="pill">${esc(e.status)}</span></div><div class="actions" style="margin-top:10px"><button class="small" onclick="showDetail('${e.id}')">詳細・レポ ${e.reports?.length?`(${e.reports.length})`:''}</button><button class="secondary small" onclick="editEvent('${e.id}')">編集</button></div></article>`).join(''):(allMode?'<div class="empty">該当する現場はないよ。</div>':'<div class="empty">この日の現場はまだないよ。</div>');
}
function openEvent(){document.getElementById('eventForm').reset();document.getElementById('eventId').value='';document.getElementById('date').value=selectedDate||isoDate(new Date());document.getElementById('eventModalTitle').textContent='現場を追加';openModal('eventModal')}
function editEvent(id){const e=events.find(x=>x.id===id);if(!e)return;document.getElementById('eventForm').reset();document.getElementById('eventId').value=e.id;['name','type','date','time','status','venue','applyDate','lotteryDate','seat','ticketNote'].forEach(k=>document.getElementById(k).value=e[k]||'');document.getElementById('eventModalTitle').textContent='現場を編集';closeModal('detailModal');openModal('eventModal')}
function saveEvent(ev){ev.preventDefault();const id=document.getElementById('eventId').value;const e={id:id||uid()};['name','type','date','time','status','venue','applyDate','lotteryDate','seat','ticketNote'].forEach(k=>e[k]=document.getElementById(k).value.trim());const old=events.find(x=>x.id===id);e.reports=old?.reports||[];if(old)events=events.map(x=>x.id===id?e:x);else events.push(e);persist();selectedDate=e.date;viewDate=new Date(e.date+'T00:00:00');closeModal('eventModal');refresh();showDetail(e.id)}
function showDetail(id){currentId=id;const e=events.find(x=>x.id===id);if(!e)return;document.getElementById('detailTitle').textContent=e.name;const item=(label,value,icon='')=>value?`<div class="detail-item"><small>${icon?icon+' ':''}${label}</small><strong>${esc(value)}</strong></div>`:'';let html=`<div class="detail-badges">${e.type?`<span class="pill">${esc(e.type)}</span>`:''}${e.status?`<span class="pill">${esc(e.status)}</span>`:''}</div><div class="event-detail-grid">${item('日付',e.date?fmt(e.date):'','▦')}${item('時間',e.time,'◷')}${item('会場',e.venue,'⌖')}${item('座席・整理番号',e.seat,'▤')}${item('申し込み日',e.applyDate?fmt(e.applyDate):'','↗')}${item('当落発表日',e.lotteryDate?fmt(e.lotteryDate):'','◇')}${item('チケット・受付メモ',e.ticketNote,'♧')}</div>`;document.getElementById('detailMeta').innerHTML=html;renderReportArea(e);openModal('detailModal')}
function renderReportArea(e){const rs=e.reports||[];document.getElementById('reportArea').innerHTML=`<h3>レポ帳 (${rs.length})</h3>`+(rs.length?rs.map(r=>{const live=r.kind==='live';const main=live?`レポ・${r.part||'部未設定'}`:`${r.part||'部未設定'}・${r.benefit||'特典会'}`;const category=live?'ライブ・公演レポ':'リリイベ・特典会';const count=(r.messages||[]).length;const photos=(r.images||[]).length;const sub=live?`${category}・📸 ${photos}枚`:`${category}・${count}メッセージ・📸 ${photos}枚`;return `<div class="eventcard"><div class="eventtop"><div><strong class="report-list-title">${esc(main)}</strong><div class="meta report-list-subtitle">${esc(sub)}</div></div><div class="actions"><span class="favorite-mark ${r.favorite?'is-favorite':''}" title="${r.favorite?'お気に入り済み':'レポ詳細からお気に入りに追加'}">${r.favorite?'♥':'♡'}</span><button class="small" onclick="openExistingReport('${e.id}','${r.id}')">開く</button><button class="danger small" onclick="deleteReport('${e.id}','${r.id}')">削除</button></div></div></div>`}).join(''):'<div class="empty">まだレポがないよ。参加した部ごとに残そう🩷</div>')}
function allReports(){return events.flatMap(e=>(e.reports||[]).map(r=>({e,r}))).sort((a,b)=>String(b.e.date||'').localeCompare(String(a.e.date||'')))}
function reportText(e,r){return [e.name,e.venue,e.date,r.part,r.benefit,r.member,r.setlist,r.highlights,r.impression,...(r.messages||[]).map(m=>m.text)].filter(Boolean).join(' ').toLowerCase()}
function renderReportSearch(){const host=document.getElementById('reportSearchResults');if(!host)return;const q=(document.getElementById('reportSearchInput')?.value||'').trim().toLowerCase(),type=document.getElementById('reportSearchType')?.value||'',fav=document.getElementById('reportSearchFavorite')?.value||'';const rows=allReports().filter(({e,r})=>(!q||reportText(e,r).includes(q))&&(!type||(type==='live'?r.kind==='live':r.kind!=='live'))&&(!fav||r.favorite));host.innerHTML=rows.length?rows.map(({e,r})=>{const live=r.kind==='live',title=live?`レポ・${r.part||'部未設定'}`:`${r.part||'部未設定'}・${r.benefit||'特典会'}`;const excerpt=(live?[r.highlights,r.impression,r.setlist].filter(Boolean).join(' '):(r.messages||[]).map(m=>m.text).join(' ')).replace(/\s+/g,' ').slice(0,115);return `<article class="eventcard report-search-card"><div><strong>${esc(title)} ${r.favorite?'♥':''}</strong><div class="meta">${esc(e.name)} · ${e.date?fmt(e.date):'日付未設定'} · ${live?'ライブ・公演':'リリイベ・特典会'}</div>${excerpt?`<div class="meta">${esc(excerpt)}${excerpt.length>=115?'…':''}</div>`:''}</div><div class="actions"><button class="small" onclick="openExistingReport('${e.id}','${r.id}')">開く</button></div></article>`}).join(''):'<div class="empty">該当するレポがないよ。別のキーワードでも探してみてね🩷</div>'}
function toggleFavorite(eid,rid){const e=events.find(x=>x.id===eid),r=e?.reports?.find(x=>x.id===rid);if(!r)return;r.favorite=!r.favorite;persist();if(e)renderReportArea(e);renderReportSearch();if(currentId===eid&&currentReportId===rid)updateCurrentFavoriteButton()}

function renderDashboard(){const el=document.getElementById('dashboardTiles');if(!el)return;const now=new Date(),year=String(now.getFullYear()),thisYear=events.filter(e=>(e.date||'').startsWith(year)),upcoming=events.filter(e=>e.date>=isoDate(now)&&!['参戦済み','中止','落選'].includes(e.status)),attended=events.filter(e=>e.status==='参戦済み'||(e.date<isoDate(now)&&e.status!=='中止'&&e.status!=='落選')).length,reports=events.reduce((n,e)=>n+(e.reports||[]).length,0);const tiles=[['🎪 現場の総数',events.length],['🗓️ これからの予定',upcoming.length],['🌸 今年の現場',thisYear.length],['📖 レポの数',reports]];el.innerHTML=tiles.map(([label,n])=>`<div class="tile"><span>${label}</span><strong>${n}</strong></div>`).join('')}

function renderReadReport(e,r){const member=getAllOptions().members.find(m=>m.name===r.member)||getAllOptions().members[0]||{name:'推し',photo:''};document.getElementById('readReportHeading').textContent=e.name;const live=r.kind==='live';document.getElementById('readReportMeta').innerHTML=[e.date?fmt(e.date):'',r.part||'',...(!live?[r.benefit||'',member.name]:[])].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('');document.getElementById('readChatMessages').classList.toggle('hidden',live);document.getElementById('readLiveContent').classList.toggle('hidden',!live);if(live){document.getElementById('readLiveContent').innerHTML=[['セトリ',r.setlist],['印象に残った演出・ファンサ',r.highlights],['ライブ全体の感想',r.impression]].filter(x=>x[1]).map(x=>`<div class="detail-note"><strong>${x[0]}</strong><div style="margin-top:6px;white-space:pre-wrap">${esc(x[1])}</div></div>`).join('')}else{document.getElementById('readChatMessages').innerHTML=(r.messages||[]).length?(r.messages||[]).map(m=>{const me=m.speaker==='me',memo=m.speaker==='memo';return `<div class="chatrow ${esc(m.speaker)}">${!memo?`<span class="chatname">${me?'わたし':esc(member.name)}</span>`:''}<div class="chatline">${m.speaker==='oshi'?memberAvatarHTML(member,28):''}<div class="bubble">${esc(m.text)}</div></div></div>`}).join(''):'<div class="empty">まだメッセージがないよ。</div>'}updateCurrentFavoriteButton()}

function editCurrentReport(){const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);if(!e||!r)return;closeModal('reportReadModal');loadReportIntoEditor(e,r);openModal('reportModal')}
function loadReportIntoEditor(e,r){applyReportOptions();cancelMessageEdit();document.getElementById('reportTitle').textContent=e.name+' のレポ';fillMemberOptions(r.member);document.getElementById('reportKind').value=Array.from(document.getElementById('reportKind').options).some(o=>o.value===r.kind)?r.kind:(r.kind==='live'?'live':document.getElementById('reportKind').options[0]?.value);document.getElementById('part').value=r.part||document.getElementById('part').options[0]?.value||'';document.getElementById('benefit').value=r.benefit||document.getElementById('benefit').options[0]?.value||'';document.getElementById('chatText').value='';document.getElementById('setlist').value=r.setlist||'';document.getElementById('liveHighlights').value=r.highlights||'';document.getElementById('liveImpression').value=r.impression||'';document.getElementById('reportImages').value='';renderReportImages(r.images||[]);renderMessages(r.messages||[]);restoreReportDraft(e,r.id);toggleReportKind();openModal('reportModal');saveReportDraft()}
function toggleReportKind(){const live=document.getElementById('reportKind').value==='live';document.getElementById('partWrap').classList.remove('hidden');document.getElementById('partLabel').textContent=live?'部':'何部？';document.getElementById('benefitWrap').classList.toggle('hidden',live);document.getElementById('reportMemberWrap').classList.toggle('hidden',live);document.getElementById('chatPanel').classList.toggle('hidden',live);document.getElementById('livePanel').classList.toggle('hidden',!live)}
function memberAvatarHTML(member,size=34){const name=member?.name||'推し',photo=typeof member?.photo==='string'&&member.photo.startsWith('data:image/')?member.photo:'';return photo?`<img class="member-avatar" style="width:${size}px;height:${size}px;flex-basis:${size}px" src="${esc(photo)}" alt="${esc(name)}の写真">`:`<span class="member-avatar-placeholder" style="width:${size}px;height:${size}px;flex-basis:${size}px" aria-label="${esc(name)}">${esc(name.slice(0,1))}</span>`}
function renderMessages(msgs){const member=getAllOptions().members.find(m=>m.name===document.getElementById('reportMember')?.value)||getAllOptions().members[0]||{name:'推し',photo:''};document.getElementById('chatMessages').innerHTML=msgs.length?msgs.map(m=>{const me=m.speaker==='me',memo=m.speaker==='memo';return `<div class="chatrow ${esc(m.speaker)}">${!memo?`<span class="chatname">${me?'わたし':esc(member.name)}</span>`:''}<div class="chatline">${m.speaker==='oshi'?memberAvatarHTML(member):''}<div class="bubble">${esc(m.text)}</div></div></div>`}).join(''):'<div class="empty">まだメッセージがないよ。下から最初のひとことを追加してね🩷</div>';const box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight}
function addMessage(){const text=document.getElementById('chatText').value.trim();if(!text)return;const e=events.find(x=>x.id===currentId);if(!e)return;let r=getWorkingReport(e);r.kind=document.getElementById('reportKind').value;r.part=document.getElementById('part').value;r.benefit=document.getElementById('benefit').value;r.member=document.getElementById('reportMember').value;r.messages=r.messages||[];if(editingMessageIndex!==null){const old=r.messages[editingMessageIndex];if(!old){cancelMessageEdit();return}r.messages[editingMessageIndex]={...old,speaker:document.getElementById('speaker').value,text};cancelMessageEdit()}else{r.messages.push({speaker:document.getElementById('speaker').value,text,time:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});document.getElementById('chatText').value=''}persist();renderMessages(r.messages)}
function openMessageManager(){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);
 if(!r||!Array.isArray(r.messages)||!r.messages.length){alert('管理できるメッセージがまだないよ。先にチャットを保存してね🩷');return}

function renderMessageManager(msgs){

 el.innerHTML=msgs.length?msgs.map((m,i)=>`<div class="eventcard"><div class="meta">${m.speaker==='me'?'わたし':m.speaker==='oshi'?esc(memberName):'思い出メモ'} · ${esc(m.time||'')}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0">${esc(m.text)}</div><div class="actions"><button type="button" class="secondary small" onclick="editMessageFromManager(${i})">編集</button><button type="button" class="danger small" onclick="removeMessageFromManager(${i})">削除</button></div></div>`).join(''):'<div class="empty">メッセージはまだないよ。</div>';

let managedMessageIndex=null;
function editMessageFromManager(i){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId),m=r?.messages?.[i];if(!m)return;
 managedMessageIndex=i;document.getElementById('managedSpeaker').value=m.speaker||'me';document.getElementById('managedText').value=m.text||'';
 closeModal('messageManagerModal');openModal('messageEditModal');

function saveManagedMessage(){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId),i=managedMessageIndex;
 if(!r||!Array.isArray(r.messages)||i===null||!r.messages[i])return;
 const before={...r.messages[i]};r.messages[i]={...r.messages[i],speaker:document.getElementById('managedSpeaker').value,text:document.getElementById('managedText').value.trim()};
 try{persist();renderMessages(r.messages);closeModal('messageEditModal');renderMessageManager(r.messages);openModal('messageManagerModal');managedMessageIndex=null}
 catch(err){r.messages[i]=before;alert('保存できなかったよ。バックアップを確認してね。')}
}
function removeMessageFromManager(i){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);
 if(!r||!Array.isArray(r.messages)||!r.messages[i]||!confirm('このメッセージを削除する？'))return;
 const before=r.messages.slice();r.messages.splice(i,1);
 try{persist();renderMessages(r.messages);renderMessageManager(r.messages)}catch(err){r.messages=before;alert('保存できなかったよ。バックアップを確認してね。')}
}
function editMessage(i){const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId),m=r?.messages?.[i];if(!m)return;editingMessageIndex=i;document.getElementById('speaker').value=m.speaker||'me';document.getElementById('chatText').value=m.text||'';document.getElementById('messageSubmitButton').textContent='変更を保存';document.getElementById('cancelMessageEdit').classList.remove('hidden');document.getElementById('chatText').focus()}
function cancelMessageEdit(){editingMessageIndex=null;const text=document.getElementById('chatText'),submit=document.getElementById('messageSubmitButton'),cancel=document.getElementById('cancelMessageEdit');if(text)text.value='';if(submit)submit.textContent='追加';if(cancel)cancel.classList.add('hidden')}
function getWorkingReport(e){let r=(e.reports||[]).find(x=>x.id===currentReportId);if(!r){r={id:uid(),kind:document.getElementById('reportKind').value,part:document.getElementById('part').value,benefit:document.getElementById('benefit').value,member:document.getElementById('reportMember').value,messages:[]};e.reports=e.reports||[];e.reports.push(r);currentReportId=r.id}return r}
function removeMessage(i){const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);if(!r||!confirm('このメッセージを削除する？'))return;r.messages.splice(i,1);persist();renderMessages(r.messages)}
function saveChatReport(){const e=events.find(x=>x.id===currentId);if(!e)return;let r=getWorkingReport(e);r.kind=document.getElementById('reportKind').value;r.part=document.getElementById('part').value;r.benefit=document.getElementById('benefit').value;r.member=document.getElementById('reportMember').value;r.images=Array.isArray(r.images)?r.images:[];try{persist();clearReportDraft();closeModal('reportModal');renderReadReport(e,r);openModal('reportReadModal')}catch(err){alert('保存できなかったよ。バックアップを確認してね。')}}
function saveLiveReport(){const e=events.find(x=>x.id===currentId);if(!e)return;let r=getWorkingReport(e);r.kind=document.getElementById('reportKind').value;r.part=document.getElementById('part').value;r.setlist=document.getElementById('setlist').value;r.highlights=document.getElementById('liveHighlights').value;r.impression=document.getElementById('liveImpression').value;persist();clearReportDraft();closeModal('reportModal');renderReadReport(e,r);openModal('reportReadModal')}
async function downloadChatImage(){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);if(!e||!r){alert('先にレポを保存してね');return}
 const color=appSettings.color||'#ec4899',live=r.kind==='live',W=1000,pad=48,gap=22,ctxCanvas=document.createElement('canvas'),ctx=ctxCanvas.getContext('2d');
 const sections=live?[['セトリ',r.setlist],['印象に残った演出・ファンサ',r.highlights],['ライブ全体の感想',r.impression]].filter(x=>x[1]):[['会話・思い出',(r.messages||[]).map(m=>(m.speaker==='me'?'わたし':m.speaker==='memo'?'思い出メモ':(r.member||'推し'))+'：'+m.text).join('\n')]].filter(x=>x[1]);
 const photos=(r.images||[]).slice(0,6),loaded=await Promise.all(photos.map(src=>loadCanvasImage(src)));ctx.font='22px sans-serif';const wrap=(text,max)=>{const lines=[];String(text||'').split('\n').forEach(p=>{let line='';for(const ch of p){if(ctx.measureText(line+ch).width>max&&line){lines.push(line);line=ch}else line+=ch}lines.push(line)});return lines};
 let blocks=sections.map(([label,text])=>({label,lines:wrap(text,W-pad*2-36)}));let H=pad+140;blocks.forEach(b=>H+=46+b.lines.length*31+gap);if(loaded.some(Boolean))H+=Math.ceil(loaded.filter(Boolean).length/3)*220+gap;H+=pad;ctxCanvas.width=W;ctxCanvas.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle=color;ctx.globalAlpha=.13;ctx.fillRect(0,0,W,130);ctx.globalAlpha=1;ctx.fillStyle='#54233d';ctx.font='bold 34px sans-serif';ctx.fillText(e.name.slice(0,38),pad,pad+28);ctx.font='20px sans-serif';ctx.fillText([e.date?fmt(e.date):'日付未設定',live?'ライブ・公演レポ':'リリイベ・特典会',r.part].filter(Boolean).join('　·　'),pad,pad+68);ctx.font='16px sans-serif';ctx.fillStyle='#8d6b7d';ctx.fillText('Oshi Log  ♡',pad,pad+104);let y=pad+140;
 blocks.forEach(b=>{ctx.fillStyle=color;ctx.globalAlpha=.13;roundRect(ctx,pad,y,W-pad*2,38,10,true,false);ctx.globalAlpha=1;ctx.fillStyle='#54233d';ctx.font='bold 21px sans-serif';ctx.fillText(b.label,pad+14,y+26);y+=48;ctx.font='19px sans-serif';ctx.fillStyle='#30242b';b.lines.forEach(line=>{ctx.fillText(line,pad+12,y);y+=31});y+=gap});
 const valid=loaded.filter(Boolean);if(valid.length){ctx.fillStyle='#54233d';ctx.font='bold 21px sans-serif';ctx.fillText('📸 思い出の写真',pad,y+8);y+=28;valid.forEach((img,i)=>{const col=i%3,row=Math.floor(i/3),x=pad+col*300,yy=y+row*210;const scale=Math.min(270/img.width,180/img.height);ctx.drawImage(img,x,yy,img.width*scale,img.height*scale)});}
 const a=document.createElement('a');a.download=`思い出カード_${e.date||'日付なし'}_${r.part||'部なし'}.png`;a.href=ctxCanvas.toDataURL('image/png');a.click();
}
function loadCanvasImage(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src})}
function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke()}
function renderReportImages(images){
 const el=document.getElementById('reportImagePreview'); if(!el)return;
 el.innerHTML=images.length?images.map((src,i)=>`<div class="photo-item"><img src="${src}" alt="思い出の写真 ${i+1}" class="tap-photo" role="button" tabindex="0" title="タップして拡大" onclick="openPhotoViewer(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhotoViewer(${i})}"><button class="danger small" onclick="removeReportImage(${i})">この写真を削除</button></div>`).join(''):'<div class="photo-empty">まだ写真はないよ🩷</div>';
}
function openPhotoViewer(index){
 const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);
 const src=r?.images?.[index];if(!src)return;
 const viewer=document.getElementById('photoViewer'),img=document.getElementById('photoViewerImage');
 img.src=src;img.alt='思い出の写真を拡大表示';viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');

function closePhotoViewer(){

function resizeImageFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function addReportImages(ev){
 const files=Array.from(ev.target.files||[]);if(!files.length)return;
 const e=events.find(x=>x.id===currentId);if(!e)return;
 let r=getWorkingReport(e);r.images=Array.isArray(r.images)?r.images:[];
 const remaining=6-r.images.length;if(remaining<=0){alert('このレポに追加できる写真は最大6枚だよ');ev.target.value='';return}
 try{for(const file of files.slice(0,remaining)){if(!file.type.startsWith('image/'))continue;r.images.push(await resizeImageFile(file))}persist();renderReportImages(r.images);if(files.length>remaining)alert('写真は1レポ最大6枚なので、追加できる分だけ保存したよ🩷')}
 catch(err){alert('画像を読み込めなかったよ。別の写真でもう一度試してね。')}
 finally{ev.target.value=''}
}
function removeReportImage(i){const e=events.find(x=>x.id===currentId),r=e?.reports?.find(x=>x.id===currentReportId);if(!r||!Array.isArray(r.images))return;if(!confirm('この写真をレポから削除する？'))return;r.images.splice(i,1);try{persist();renderReportImages(r.images)}catch(err){alert('保存できなかったよ。バックアップを確認してね。')}}
function deleteReport(eid,rid){
  if(!confirm('このレポを削除する？'))return;
  const e=events.find(x=>x.id===eid);
  if(!e){alert('対象の現場が見つからなかったよ。画面を更新してみてね。');return}
  const before=e.reports||[];
  e.reports=before.filter(r=>r.id!==rid);
  if(e.reports.length===before.length){alert('削除するレポが見つからなかったよ。');return}
  try{
    persist();
    renderReportArea(e);
    alert('レポを削除したよ🩷');
  }catch(err){
    e.reports=before;
    alert('保存できず、削除を取り消したよ。設定・バックアップからJSONバックアップを保存して、ブラウザの空き容量を確認してね。');
  }
}
function editCurrent(){editEvent(currentId)}
function deleteCurrent(){
  if(!confirm('この現場と紐づくレポをすべて削除する？'))return;
  const before=events;
  const target=currentId;
  if(!before.some(e=>e.id===target)){alert('対象の現場が見つからなかったよ。画面を更新してみてね。');return}
  events=before.filter(e=>e.id!==target);
  try{
    persist();
    closeModal('detailModal');
    currentId=null;
    refresh();
    alert('現場と紐づくレポを削除したよ🩷');
  }catch(err){
    events=before;
    alert('保存できず、削除を取り消したよ。設定・バックアップからJSONバックアップを保存して、ブラウザの空き容量を確認してね。');
    refresh();
  }
}
function refresh(){document.getElementById('selectedHeading').textContent=selectedDate?'🎪'+fmt(selectedDate)+'の予定':'🎪予定';renderCalendar();renderEvents();renderDashboard();renderReportSearch()}
function backup(){try{const blob=new Blob([JSON.stringify({app:'Oshi Log',version:4,exportedAt:new Date().toISOString(),settings:appSettings,events},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`pink-oshi-log-${isoDate(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);localStorage.setItem(BACKUP_DATE_KEY,new Date().toISOString());updateBackupStatus();alert('バックアップを書き出したよ🩷')}catch(err){alert('バックアップを作成できなかったよ。ブラウザの空き容量を確認してね。')}}
function downloadSafetyBackup(){const blob=new Blob([JSON.stringify({app:'Oshi Log',version:4,exportedAt:new Date().toISOString(),settings:appSettings,events},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`pink-oshi-log-before-restore-${isoDate(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreBackup(ev){const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const arr=Array.isArray(data)?data:data.events;if(!Array.isArray(arr))throw new Error('形式');if(!arr.every(e=>e&&typeof e==='object'))throw new Error('データ形式');if(!confirm('バックアップを復元すると、現在の現場・レポが置き換わるよ。続ける？\n\n復元前に現在のデータも別ファイルとして保存します。'))return;downloadSafetyBackup();events=arr.map(e=>({...e,id:e.id||uid(),reports:Array.isArray(e.reports)?e.reports:[]}));if(data&&data.settings&&typeof data.settings==='object'){appSettings=data.settings;localStorage.setItem(SETTINGS_KEY,JSON.stringify(appSettings))}persist();refresh();applySettings();renderDashboard();renderReportSearch();alert('バックアップを復元したよ🩷\n念のため、復元前のデータもダウンロードフォルダに保存しました。')}catch(err){alert('読み込めなかったよ。Oshi Log のJSONファイルを選んでね。')}finally{ev.target.value=''}};reader.readAsText(file)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhotoViewer()});
document.getElementById('chatText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addMessage()}});
refresh();
applySettings();
renderDashboard();renderReportSearch();updateBackupStatus();
